name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win; no value in finishing a superseded deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The build identity is stamped into the committed files by
      # tools/stamp.mjs, not here. GitHub's built-in branch-based Pages build
      # also publishes on every push to main and races this workflow, so
      # anything edited at deploy time is discarded whenever that one lands
      # last. Serving the committed bytes makes both publishers agree.

      # enablement: true turns Pages on via the API rather than requiring
      # someone to set Settings > Pages > Source by hand first, which is what
      # made the first deploy fail with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # No build step — the repo root is the site.
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
