<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthia — pocket synth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Turn a Bluetooth MIDI keyboard into a synth and drum machine that plays through your phone.">
<meta name="theme-color" content="#0a0b0f">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synthia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="both" data-mode="play">

<!-- Audio can only start from a gesture, so the first screen is a deliberate tap. -->
<div class="splash" id="splash">
  <div class="splash__inner">
    <div class="splash__mark" aria-hidden="true">
      <span class="splash__key"></span><span class="splash__key"></span>
      <span class="splash__key"></span><span class="splash__key"></span>
    </div>
    <h1 class="splash__title">Synthia</h1>
    <p class="splash__tag">A synth and drum box for your Bluetooth keyboard.<br>Sound comes out of the phone.</p>
    <button class="btn btn--big" id="splash-start">Tap to start</button>
    <p class="splash__hint" id="splash-hint"></p>
  </div>
</div>

<div class="app" id="app" hidden>

  <header class="topbar">
    <button class="chip chip--conn" id="conn-chip" aria-label="Connection">
      <span class="dot" id="conn-dot"></span>
      <span class="chip__label" id="conn-label">No keyboard</span>
    </button>

    <button class="chip chip--patch" id="patch-chip" aria-label="Change sound">
      <span class="swatch" id="patch-swatch"></span>
      <span class="chip__label" id="patch-label">Warm Keys</span>
    </button>

    <div class="topbar__spacer"></div>

    <button class="iconbtn iconbtn--rec" id="rec-btn" aria-label="Record">
      <span class="rec-dot"></span><span class="rec-time" id="rec-time"></span>
    </button>

    <button class="iconbtn" id="bash-btn" aria-label="Bash mode for toddlers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9v5a2 2 0 0 0 2 2h3v-7H5.2A7 7 0 0 1 18.8 12H16v7h3a2 2 0 0 0 2-2v-5a9 9 0 0 0-9-9Z"/></svg>
      <span class="iconbtn__text">Bash</span>
    </button>

    <button class="iconbtn" id="menu-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10a3 3 0 0 1 6 0M4 17h6a3 3 0 0 1 6 0h4M4 12h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="17" cy="7" r="2.4"/><circle cx="13" cy="17" r="2.4"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <canvas class="viz" id="viz" aria-hidden="true"></canvas>

    <div class="perf" id="perf">
      <div class="padwrap" id="padwrap">
        <div class="pads" id="pads" role="group" aria-label="Trigger pads"></div>
      </div>

      <!-- Octave lives beside the keys rather than in the top bar: it's within
           thumb reach while playing, and the top bar has no room on a phone. -->
      <div class="keyrow" id="keyrow">
        <button class="octbtn" id="oct-down" aria-label="Octave down">
          <span class="octbtn__sign">−</span>
          <span class="octbtn__val" id="oct-val">0</span>
        </button>
        <div class="keywrap" id="keywrap">
          <div class="keys" id="keys" role="group" aria-label="Keyboard"></div>
        </div>
        <button class="octbtn" id="oct-up" aria-label="Octave up">
          <span class="octbtn__sign">+</span>
          <span class="octbtn__cap">oct</span>
        </button>
      </div>
    </div>

    <div class="hint" id="hint" hidden></div>
  </main>

  <section class="macros" id="macros" aria-label="Performance controls">
    <div class="knobrow" id="knobrow"></div>
    <div class="toggles">
      <button class="tog" id="tog-arp" aria-pressed="false"><b>Arp</b><i id="arp-rate">1/8</i></button>
      <button class="tog" id="tog-hold" aria-pressed="false"><b>Hold</b><i>latch</i></button>
      <button class="tog" id="tog-groove" aria-pressed="false"><b>Beat</b><i id="groove-name">Boom Bap</i></button>
      <button class="tog tog--tempo" id="tog-tempo"><b id="tempo-val">96</b><i>bpm</i></button>
    </div>
  </section>

  <nav class="viewbar" aria-label="Layout">
    <button class="viewbtn" data-view="keys">Keys</button>
    <button class="viewbtn" data-view="pads">Pads</button>
    <button class="viewbtn is-on" data-view="both">Both</button>
    <span class="viewbar__spacer"></span>
    <span class="meter" id="meter" aria-hidden="true"><i></i></span>
    <span class="stat" id="stat-voices" title="Active voices">0</span>
    <button class="panicbtn" id="panic-btn" aria-label="Stop all sound">Panic</button>
  </nav>
</div>

<!-- Bash mode lives outside .app so it can cover everything -->
<div class="bash" id="bash" hidden>
  <div class="bash__tiles" id="bash-tiles"></div>
  <button class="bash__exit" id="bash-exit" aria-label="Hold to exit Bash mode">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <circle class="bash__ring-bg" cx="22" cy="22" r="19"></circle>
      <circle class="bash__ring" id="bash-ring" cx="22" cy="22" r="19"></circle>
    </svg>
    <span class="bash__exit-label">hold</span>
  </button>
  <div class="bash__toast" id="bash-toast" hidden></div>
</div>

<div class="sheet-root" id="sheet-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
